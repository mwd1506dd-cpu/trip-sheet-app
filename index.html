<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Sheet Calculator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            font-size: 19px;
            margin: 10px 0 15px 0;
        }
        .unit-badge {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 5px;
        }
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            background-color: #1e293b;
            padding: 6px;
            border-radius: 10px;
        }
        .lang-btn {
            flex: 1;
            padding: 8px 6px;
            border: 2px solid transparent;
            border-radius: 6px;
            background-color: #334155;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-right: 4px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        html[dir="ltr"] .card {
            border-right: none;
            border-left: 4px solid #38bdf8;
        }
        .card-title {
            color: #38bdf8;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 13px;
            color: #94a3b8;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        optgroup {
            background-color: #1e293b;
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
        }
        option {
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn-primary { background-color: #38bdf8; color: #0f172a; }
        .btn-success { background-color: #22c55e; color: #fff; margin-top: 10px; }
        .btn-danger { background-color: #ef4444; color: #fff; }
        .btn-secondary { background-color: #475569; color: #fff; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn-row .btn { margin-top: 0; }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #94a3b8; }
        .result-value { font-weight: bold; color: #fff; }
        .status-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .safe { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; border: 2px solid #22c55e; }
        .warning { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border: 2px solid #ef4444; }
        .custom-fields { display: none; margin-top: 8px; }
        .custom-fields.active { display: block; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
        #result { display: none; }
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 600px;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 8px 6px;
            text-align: right;
            font-weight: bold;
            border-bottom: 2px solid #38bdf8;
            white-space: nowrap;
        }
        html[dir="ltr"] th { text-align: left; }
        td {
            padding: 7px 6px;
            border-bottom: 1px solid #334155;
            text-align: right;
            color: #e2e8f0;
        }
        html[dir="ltr"] td { text-align: left; }
        tr:nth-child(even) { background-color: rgba(15, 23, 42, 0.5); }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .badge-safe { background-color: #22c55e; color: #fff; }
        .badge-warn { background-color: #ef4444; color: #fff; }
        .total-row { background-color: #0f172a !important; font-weight: bold; }
        .total-row td { color: #38bdf8; border-top: 2px solid #38bdf8; padding: 10px 6px; }
        .delete-btn {
            background-color: #ef4444;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .stat-box {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-label { font-size: 11px; color: #94a3b8; }
        .stat-value { font-size: 15px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
        .stat-value.warn { color: #ef4444; }
        .stat-value.ok { color: #22c55e; }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .tool-item {
            background-color: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 11px;
        }
        .tool-od { color: #38bdf8; font-weight: bold; }
        .tool-id { color: #94a3b8; }
    </style>
</head>
<body>

    <h1>🛢️ <span data-i18n="title">Trip Sheet Calculator</span> <span class="unit-badge">Metric</span></h1>

    <!-- أزرار اللغة -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ar')" id="btn-ar">🇩🇿 AR</button>
        <button class="lang-btn" onclick="setLanguage('en')" id="btn-en">🇬🇧 EN</button>
        <button class="lang-btn" onclick="setLanguage('fr')" id="btn-fr">🇫🇷 FR</button>
    </div>

    <!-- إدخال البيانات -->
    <div class="card">
        <div class="card-title" data-i18n="pipeData">⚙️ Pipe Data</div>
        
        <label data-i18n="component">Component:</label>
        <select id="component" onchange="toggleCustom()">
            <optgroup label="Drill Pipe (DP)">
                <option value="2.375,1.815">DP 2 3/8"</option>
                <option value="2.875,2.151">DP 2 7/8"</option>
                <option value="3.5,2.764">DP 3 1/2"</option>
                <option value="3.5,2.602">DP 3 1/2" (thick)</option>
                <option value="4,3.34">DP 4"</option>
                <option value="4.5,3.826">DP 4 1/2"</option>
                <option value="4.5,3.64">DP 4 1/2" (thick)</option>
                <option value="5,4.276" selected>DP 5"</option>
                <option value="5,4">DP 5" (thick)</option>
                <option value="5.5,4.778">DP 5 1/2"</option>
            </optgroup>
            <optgroup label="Heavy Weight Drill Pipe (HWDP)">
                <option value="3.5,2.25">HWDP 3 1/2"</option>
                <option value="4,2.563">HWDP 4"</option>
                <option value="4.5,2.75">HWDP 4 1/2"</option>
                <option value="5,3">HWDP 5"</option>
                <option value="5.5,3.25">HWDP 5 1/2"</option>
            </optgroup>
            <optgroup label="Drill Collar (DC)">
                <option value="4.125,2">DC 4 1/8"</option>
                <option value="4.75,2">DC 4 3/4"</option>
                <option value="6.25,2.25">DC 6 1/4"</option>
                <option value="6.5,2.25">DC 6 1/2"</option>
                <option value="6.5,2.813">DC 6 1/2" (ID 2.813)</option>
                <option value="6.75,2.25">DC 6 3/4"</option>
                <option value="7,2.25">DC 7"</option>
                <option value="8,2.813">DC 8"</option>
                <option value="9.5,3">DC 9 1/2"</option>
            </optgroup>
            <option value="custom" data-i18n="customOption">✏️ Custom</option>
        </select>

        <div class="custom-fields" id="customFields">
            <div class="row">
                <div>
                    <label data-i18n="od">OD (inch):</label>
                    <input type="number" id="od" value="5" step="0.001">
                </div>
                <div>
                    <label data-i18n="id">ID (inch):</label>
                    <input type="number" id="id" value="4.276" step="0.001">
                </div>
            </div>
        </div>

        <div class="row">
            <div>
                <label data-i18n="standLength">Stand Length (m):</label>
                <input type="number" id="standLength" value="28.5" step="0.01">
            </div>
            <div>
                <label data-i18n="standsPulled">Stands:</label>
                <input type="number" id="standsPulled" value="1" step="1">
            </div>
        </div>
    </div>

    <!-- قراءات Trip Tank -->
    <div class="card">
        <div class="card-title" data-i18n="tripTankReadings">📊 Trip Tank Readings</div>
        
        <div class="row">
            <div>
                <label data-i18n="beforeVolume">Before (L):</label>
                <input type="number" id="beforeVolume" value="0" step="1">
            </div>
            <div>
                <label data-i18n="afterVolume">After (L):</label>
                <input type="number" id="afterVolume" value="0" step="1">
            </div>
        </div>
        <div class="hint" data-i18n="tankHint">💡 Hint...</div>
    </div>

    <!-- زر الحساب -->
    <button class="btn btn-primary" onclick="calculateTrip()" data-i18n="calculateBtn">Calculate</button>

    <!-- النتائج -->
    <div class="card" id="result">
        <div class="card-title" data-i18n="resultTitle">📋 Result</div>
        <div id="resultContent"></div>
        <button class="btn btn-success" onclick="addToTable()" data-i18n="addToSheet">➕ Add to Trip Sheet</button>
    </div>

    <!-- الإحصائيات -->
    <div class="card" id="statsCard" style="display:none;">
        <div class="card-title" data-i18n="summaryTitle">📈 Summary</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label" data-i18n="totalLength">Total Length</div>
                <div class="stat-value" id="statLength">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="totalExpected">Total Expected</div>
                <div class="stat-value" id="statExpected">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="totalActual">Total Actual</div>
                <div class="stat-value" id="statActual">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" data-i18n="totalDiff">Total Diff</div>
                <div class="stat-value" id="statDiff">0</div>
            </div>
        </div>
        <div id="overallStatus" class="status-box" style="display:none;"></div>
    </div>

    <!-- الجدول -->
    <div class="card" id="tableCard" style="display:none;">
        <div class="card-title" data-i18n="tripSheetTitle">📋 Trip Sheet</div>
        <div class="table-container">
            <table id="tripTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th data-i18n="colType">Type</th>
                        <th data-i18n="colLength">Length (m)</th>
                        <th data-i18n="colExpected">Exp (L)</th>
                        <th data-i18n="colActual">Act (L)</th>
                        <th data-i18n="colDiff">Diff (L)</th>
                        <th data-i18n="colStatus">Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="btn-row">
            <button class="btn btn-secondary" onclick="copyTable()" data-i18n="copyBtn">📋 Copy</button>
            <button class="btn btn-danger" onclick="clearTable()" data-i18n="clearBtn">🗑️ Clear</button>
        </div>
    </div>

    <script>
        // ============ الترجمات ============
        const translations = {
            ar: {
                title: "حاسبة ورقة السفر", pipeData: "⚙️ بيانات الأنبوب",
                component: "نوع الأنبوب:", customOption: "✏️ مخصص",
                od: "القطر الخارجي (بوصة):", id: "القطر الداخلي (بوصة):",
                standLength: "طول الـ Stand (م):", standsPulled: "عدد الـ Stands:",
                tripTankReadings: "📊 قراءات Trip Tank",
                beforeVolume: "قبل السحب (لتر):", afterVolume: "بعد السحب (لتر):",
                tankHint: "💡 الفرق بين القراءتين هو الحجم الفعلي.",
                calculateBtn: "احسب الآن", resultTitle: "📋 نتيجة الحساب",
                addToSheet: "➕ إضافة إلى Trip Sheet", summaryTitle: "📈 الملخص",
                totalLength: "إجمالي الطول", totalExpected: "إجمالي المتوقع",
                totalActual: "إجمالي الفعلي", totalDiff: "الفرق الكلي",
                tripSheetTitle: "📋 Trip Sheet", colType: "النوع",
                colLength: "الطول (م)", colExpected: "المتوقع (ل)",
                colActual: "الفعلي (ل)", colDiff: "الفرق (ل)", colStatus: "الحالة",
                copyBtn: "📋 نسخ", clearBtn: "🗑️ مسح",
                pipeType: "نوع الأنبوب:", standsCount: "عدد الـ Stands:",
                totalLenLabel: "الطول الإجمالي:", displacementLabel: "الإزاحة (ل/م):",
                capacityLabel: "السعة (ل/م):", expectedVol: "الحجم المتوقع:",
                actualVol: "الحجم الفعلي:", diffLabel: "الفرق:",
                expectedM3: "الحجم المتوقع (م³):", totalLabel: "الإجمالي",
                safeStatus: "✅ آمن", kickWarning: "⚠️ تحذير: Kick!",
                lossesWarning: "⚠️ تحذير: Losses!",
                overallSafe: "✅ الحالة العامة: آمن",
                overallKick: "⚠️ تحذير عام: Kick!",
                overallLosses: "⚠️ تحذير عام: Losses!",
                alertFillAll: "الرجاء إدخال جميع البيانات",
                confirmDelete: "حذف هذا الصف؟", confirmClear: "مسح الجدول؟",
                copySuccess: "✅ تم النسخ!", copyFail: "تعذر النسخ",
                meter: "م", liter: "لتر", badgeOK: "OK", badgeWarn: "!"
            },
            en: {
                title: "Trip Sheet Calculator", pipeData: "⚙️ Pipe Data",
                component: "Component:", customOption: "✏️ Custom",
                od: "OD (inch):", id: "ID (inch):",
                standLength: "Stand Length (m):", standsPulled: "Stands:",
                tripTankReadings: "📊 Trip Tank Readings",
                beforeVolume: "Before (L):", afterVolume: "After (L):",
                tankHint: "💡 Difference between readings = actual volume.",
                calculateBtn: "Calculate", resultTitle: "📋 Result",
                addToSheet: "➕ Add to Trip Sheet", summaryTitle: "📈 Summary",
                totalLength: "Total Length", totalExpected: "Total Expected",
                totalActual: "Total Actual", totalDiff: "Total Diff",
                tripSheetTitle: "📋 Trip Sheet", colType: "Type",
                colLength: "Length (m)", colExpected: "Exp (L)",
                colActual: "Act (L)", colDiff: "Diff (L)", colStatus: "Status",
                copyBtn: "📋 Copy", clearBtn: "🗑️ Clear",
                pipeType: "Pipe Type:", standsCount: "Stands:",
                totalLenLabel: "Total Length:", displacementLabel: "Displacement (L/m):",
                capacityLabel: "Capacity (L/m):", expectedVol: "Expected Vol:",
                actualVol: "Actual Vol:", diffLabel: "Difference:",
                expectedM3: "Expected Vol (m³):", totalLabel: "Total",
                safeStatus: "✅ Safe", kickWarning: "⚠️ Warning: KICK!",
                lossesWarning: "⚠️ Warning: LOSSES!",
                overallSafe: "✅ Overall: SAFE",
                overallKick: "⚠️ Overall: KICK!",
                overallLosses: "⚠️ Overall: LOSSES!",
                alertFillAll: "Please fill all required fields",
                confirmDelete: "Delete this row?", confirmClear: "Clear table?",
                copySuccess: "✅ Copied!", copyFail: "Copy failed",
                meter: "m", liter: "L", badgeOK: "OK", badgeWarn: "!"
            },
            fr: {
                title: "Calculateur Feuille de Voyage", pipeData: "⚙️ Données Tubage",
                component: "Composant:", customOption: "✏️ Personnalisé",
                od: "OD (pouce):", id: "ID (pouce):",
                standLength: "Longueur Stand (m):", standsPulled: "Stands:",
                tripTankReadings: "📊 Lectures Trip Tank",
                beforeVolume: "Avant (L):", afterVolume: "Après (L):",
                tankHint: "💡 Différence entre lectures = volume réel.",
                calculateBtn: "Calculer", resultTitle: "📋 Résultat",
                addToSheet: "➕ Ajouter", summaryTitle: "📈 Résumé",
                totalLength: "Longueur Totale", totalExpected: "Total Attendu",
                totalActual: "Total Réel", totalDiff: "Différence",
                tripSheetTitle: "📋 Feuille de Voyage", colType: "Type",
                colLength: "Longueur (m)", colExpected: "Att (L)",
                colActual: "Réel (L)", colDiff: "Diff (L)", colStatus: "Statut",
                copyBtn: "📋 Copier", clearBtn: "🗑️ Effacer",
                pipeType: "Type Tubage:", standsCount: "Stands:",
                totalLenLabel: "Longueur Totale:", displacementLabel: "Déplacement (L/m):",
                capacityLabel: "Capacité (L/m):", expectedVol: "Vol Attendu:",
                actualVol: "Vol Réel:", diffLabel: "Différence:",
                expectedM3: "Vol Attendu (m³):", totalLabel: "Total",
                safeStatus: "✅ Sécurisé", kickWarning: "⚠️ Alerte: KICK!",
                lossesWarning: "⚠️ Alerte: PERTES!",
                overallSafe: "✅ Global: SÉCURISÉ",
                overallKick: "⚠️ Global: KICK!",
                overallLosses: "⚠️ Global: PERTES!",
                alertFillAll: "Remplissez tous les champs",
                confirmDelete: "Supprimer cette ligne?", confirmClear: "Effacer le tableau?",
                copySuccess: "✅ Copié!", copyFail: "Échec copie",
                meter: "m", liter: "L", badgeOK: "OK", badgeWarn: "!"
            }
        };

        let currentLang = 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('htmlRoot').setAttribute('lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            localStorage.setItem('tripSheetLang', lang);
            if (tripData.length > 0) renderTable();
        }

        function t(key) { return translations[currentLang][key] || key; }

        // ============ ثوابت ============
        const FT_TO_M = 0.3048;
        const BBL_TO_L = 158.987;

        // استخراج OD و ID من القيمة المختارة
        function getPipeDimensions() {
            const select = document.getElementById('component');
            if (select.value === 'custom') {
                return {
                    od: parseFloat(document.getElementById('od').value),
                    id: parseFloat(document.getElementById('id').value),
                    name: `Custom ${document.getElementById('od').value}"`
                };
            }
            const parts = select.value.split(',');
            const od = parseFloat(parts[0]);
            const id = parseFloat(parts[1]);
            const name = select.options[select.selectedIndex].text;
            return { od, id, name };
        }

        function toggleCustom() {
            const select = document.getElementById('component');
            const customFields = document.getElementById('customFields');
            if (select.value === 'custom') {
                customFields.classList.add('active');
            } else {
                customFields.classList.remove('active');
            }
        }

        let tripData = [];
        let lastCalculation = null;

        function calculateTrip() {
            const pipe = getPipeDimensions();
            const standLength = parseFloat(document.getElementById('standLength').value);
            const standsPulled = parseFloat(document.getElementById('standsPulled').value);
            const beforeVolume = parseFloat(document.getElementById('beforeVolume').value);
            const afterVolume = parseFloat(document.getElementById('afterVolume').value);

            if (!pipe || !standLength || !standsPulled) {
                alert(t('alertFillAll'));
                return;
            }

            const totalLength = standLength * standsPulled;
            const displacementPerFtBbl = (Math.pow(pipe.od, 2) - Math.pow(pipe.id, 2)) / 1029.4;
            const displacementPerM_L = displacementPerFtBbl * BBL_TO_L / FT_TO_M;
            const capacityPerFtBbl = Math.pow(pipe.id, 2) / 1029.4;
            const capacityPerM_L = capacityPerFtBbl * BBL_TO_L / FT_TO_M;
            const calculatedVolume = totalLength * displacementPerM_L;
            const actualVolume = afterVolume - beforeVolume;
            const difference = actualVolume - calculatedVolume;

            let statusMessage = '', statusClass = '', badge = '';
            if (Math.abs(difference) < 100) {
                statusMessage = t('safeStatus');
                statusClass = 'safe'; badge = 'safe';
            } else if (difference > 100) {
                statusMessage = t('kickWarning');
                statusClass = 'warning'; badge = 'warn';
            } else {
                statusMessage = t('lossesWarning');
                statusClass = 'warning'; badge = 'warn';
            }

            lastCalculation = {
                pipe: pipe, stands: standsPulled, totalLength: totalLength,
                calculatedVolume: calculatedVolume, actualVolume: actualVolume,
                difference: difference, status: badge
            };

            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            resultDiv.style.display = 'block';

            resultContent.innerHTML = `
                <div class="result-row"><span class="result-label">${t('pipeType')}</span><span class="result-value">${pipe.name}</span></div>
                <div class="result-row"><span class="result-label">OD / ID:</span><span class="result-value">${pipe.od}" / ${pipe.id}"</span></div>
                <div class="result-row"><span class="result-label">${t('standsCount')}</span><span class="result-value">${standsPulled}</span></div>
                <div class="result-row"><span class="result-label">${t('totalLenLabel')}</span><span class="result-value">${totalLength.toFixed(2)} ${t('meter')}</span></div>
                <div class="result-row"><span class="result-label">${t('displacementLabel')}</span><span class="result-value">${displacementPerM_L.toFixed(2)}</span></div>
                <div class="result-row"><span class="result-label">${t('capacityLabel')}</span><span class="result-value">${capacityPerM_L.toFixed(2)}</span></div>
                <div class="result-row"><span class="result-label">${t('expectedVol')}</span><span class="result-value">${calculatedVolume.toFixed(1)} ${t('liter')}</span></div>
                <div class="result-row"><span class="result-label">${t('actualVol')}</span><span class="result-value">${actualVolume.toFixed(1)} ${t('liter')}</span></div>
                <div class="result-row"><span class="result-label">${t('diffLabel')}</span><span class="result-value">${difference.toFixed(1)} ${t('liter')}</span></div>
                <div class="result-row"><span class="result-label">${t('expectedM3')}</span><span class="result-value">${(calculatedVolume/1000).toFixed(3)} m³</span></div>
                <div class="status-box ${statusClass}">${statusMessage}</div>
            `;
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function addToTable() {
            if (!lastCalculation) return;
            tripData.push(lastCalculation);
            renderTable();
            document.getElementById('beforeVolume').value = document.getElementById('afterVolume').value;
        }

        function renderTable() {
            const tableCard = document.getElementById('tableCard');
            const statsCard = document.getElementById('statsCard');
            const tbody = document.getElementById('tableBody');
            if (tripData.length === 0) {
                tableCard.style.display = 'none';
                statsCard.style.display = 'none';
                return;
            }
            tableCard.style.display = 'block';
            statsCard.style.display = 'block';

            let html = '';
            let totalLength = 0, totalExpected = 0, totalActual = 0, totalDiff = 0;

            tripData.forEach((row, i) => {
                totalLength += row.totalLength;
                totalExpected += row.calculatedVolume;
                totalActual += row.actualVolume;
                totalDiff += row.difference;
                html += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${row.pipe.name}</td>
                        <td>${row.totalLength.toFixed(2)}</td>
                        <td>${row.calculatedVolume.toFixed(1)}</td>
                        <td>${row.actualVolume.toFixed(1)}</td>
                        <td>${row.difference.toFixed(1)}</td>
                        <td><span class="badge badge-${row.status}">${row.status === 'safe' ? t('badgeOK') : t('badgeWarn')}</span></td>
                        <td><button class="delete-btn" onclick="deleteRow(${i})">✕</button></td>
                    </tr>
                `;
            });

            html += `
                <tr class="total-row">
                    <td colspan="2">${t('totalLabel')}</td>
                    <td>${totalLength.toFixed(2)}</td>
                    <td>${totalExpected.toFixed(1)}</td>
                    <td>${totalActual.toFixed(1)}</td>
                    <td>${totalDiff.toFixed(1)}</td>
                    <td colspan="2"></td>
                </tr>
            `;
            tbody.innerHTML = html;

            document.getElementById('statLength').textContent = totalLength.toFixed(2) + " " + t('meter');
            document.getElementById('statExpected').textContent = totalExpected.toFixed(1) + " " + t('liter');
            document.getElementById('statActual').textContent = totalActual.toFixed(1) + " " + t('liter');
            const diffEl = document.getElementById('statDiff');
            diffEl.textContent = totalDiff.toFixed(1) + " " + t('liter');
            diffEl.className = 'stat-value ' + (Math.abs(totalDiff) < 100 ? 'ok' : 'warn');

            const statusEl = document.getElementById('overallStatus');
            statusEl.style.display = 'block';
            if (Math.abs(totalDiff) < 100) {
                statusEl.className = 'status-box safe';
                statusEl.textContent = t('overallSafe');
            } else if (totalDiff > 100) {
                statusEl.className = 'status-box warning';
                statusEl.textContent = t('overallKick');
            } else {
                statusEl.className = 'status-box warning';
                statusEl.textContent = t('overallLosses');
            }
        }

        function deleteRow(index) {
            if (confirm(t('confirmDelete'))) {
                tripData.splice(index, 1);
                renderTable();
            }
        }

        function clearTable() {
            if (confirm(t('confirmClear'))) {
                tripData = [];
                renderTable();
            }
        }

        function copyTable() {
            let text = "Trip Sheet (Metric)\n=====================\n";
            text += "#\tType\tLength(m)\tExpected(L)\tActual(L)\tDiff(L)\n";
            tripData.forEach((row, i) => {
                text += `${i+1}\t${row.pipe.name}\t${row.totalLength.toFixed(2)}\t${row.calculatedVolume.toFixed(1)}\t${row.actualVolume.toFixed(1)}\t${row.difference.toFixed(1)}\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert(t('copySuccess'))).catch(() => alert(t('copyFail')));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('tripSheetLang') || 'ar';
            setLanguage(savedLang);
        });
    </script>

</body>
</html>
